# Keep the MSVC C runtime statically linked so released binaries do not require
# the Visual C++ redistributable.
#
# (An older revision of this file also carried `-L` flags pointing at a local
# MySQL installation and `-Wl,-Bstatic` arguments, which are not valid for the
# MSVC linker and only worked because those paths happened to be ignored.)
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
