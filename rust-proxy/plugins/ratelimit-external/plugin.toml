id = "io.example.ratelimit-external"
name = "External Rate Limiter"
version = "0.1.0"
description = "Asks an external HTTP rate limiter whether the request's key may proceed and answers 429 when it says no."
authors = ["Spire contributors"]
api = "spire:filter@0.1.0"
wasm = "dist/plugin.wasm"

# Every capability this plugin actually uses. A missing one makes the matching
# host call return `denied` instead of trapping, so the plugin degrades rather
# than breaking the route.
[capabilities]
required = ["host.http-call", "host.log", "host.metrics"]
optional = []
