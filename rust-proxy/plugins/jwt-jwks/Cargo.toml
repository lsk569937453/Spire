[package]
name = "spire-plugin-jwt-jwks"
version = "0.1.0"
edition = "2021"
publish = false

# A plugin builds on its own, for `wasm32-wasip2`, outside the gateway crate.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# The guest half of the component model. Version pins are intentionally loose:
# the *host* checks the WIT package version, not the binding generator.
wit-bindgen = "0.63"
serde_json = "1"
# Signature verification only: no PEM, no key encoding, and the pure-Rust
# crypto backend so the guest stays a portable wasm32-wasip2 component.
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
