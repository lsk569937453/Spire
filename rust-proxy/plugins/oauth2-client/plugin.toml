id = "io.example.oauth2-client"
name = "OAuth2 Client Credentials"
version = "0.1.0"
description = "Fetches a client-credentials access token, caches it in shared data, and injects `Authorization: Bearer <token>` into requests that carry none."
authors = ["Spire contributors"]
api = "spire:filter@0.1.0"
wasm = "dist/plugin.wasm"

# Every capability this plugin actually uses. A missing one makes the matching
# host call return `denied` instead of trapping, so the plugin degrades rather
# than breaking the route.
[capabilities]
required = ["host.http-call", "host.shared-data", "host.clock", "host.log", "host.metrics"]
optional = []
