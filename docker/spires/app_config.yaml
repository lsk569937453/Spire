# Example configuration shipped inside the container image.
#
# It proxies port 6667 to a single upstream and exposes the read-only
# observability listener (`/health`, `/metrics`) on 8870. The listener is
# unauthenticated, so it binds to loopback by default; set
# `observability.listen: 0.0.0.0:8870` when Prometheus scrapes it from another
# container or host (the bundled compose file publishes the port for that).
log_level: info
observability:
  listen: 0.0.0.0:8870

servers:
  - listen: 6667
    protocol: http
    routes:
      - route_id: default
        matchers:
          - kind: path
            value: /
            match_type: prefix
        forward_to: http://backend:80/
