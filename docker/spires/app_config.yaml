# Example configuration shipped inside the container image.
#
# It proxies port 6667 to a single upstream and keeps the admin API on loopback
# (the default). Set `admin_listen: 0.0.0.0` **and** `admin_token` if you want to
# reach the control plane from outside the container.
log_level: info
admin_port: 8870

servers:
  - listen: 6667
    protocol: http
    routes:
      - route_id: default
        matchers:
          - kind: path
            value: /
            match_type: prefix
        forward_to: http://backend:80/
