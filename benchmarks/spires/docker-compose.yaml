version: "3.9"

services:
  test:
    image: demisto/rakyll-hey:1.0.0.44140
    container_name: hey
    tty: true
    deploy:
      resources:
        limits:
          cpus: "12.0"
          memory: 8192M
  backend:
    image: ghcr.io/lsk569937453/echo-server:0.0.5
    container_name: backend
    ports:
      - "9394:8080"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8192M
  spire:
    # image: ghcr.io/lsk569937453/spire:0.0.20
    image: lsk569937453/spire:0.0.24
    container_name: spire
    environment:
      CONFIG_FILE_PATH: /temp/app_config.yaml
      RUST_BACKTRACE: 1
      # The proxy uses mimalloc on non-MSVC targets. Lazy arena commit keeps the
      # post-burst RSS close to the live set instead of at the allocator's
      # high-water mark (the stale JEMALLOC_* var that used to live here has no
      # effect on this allocator).
      MIMALLOC_ARENA_EAGER_COMMIT: "0"
    volumes:
      - ./app_config.yaml:/tmp/app_config.yaml
    restart: unless-stopped
    ports:
      - 6667:6667
      - 8870:8870
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8192M
  hyper-test:
    # image: ghcr.io/lsk569937453/spire:0.0.20
    image: lsk569937453/hyper-test:0.0.1
    container_name: hyper
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8192M
