name: "ci"

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer commit on the same ref cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting and lints are cheap and catch most drift, so they run first.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-proxy
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-proxy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (all targets, warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust-proxy
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-proxy

      - name: Build
        run: cargo build --locked --all-targets

      # The suite must stay green: it was red for an unknown number of commits
      # because this workflow only ran on tags and never executed the tests.
      - name: Test
        run: cargo test --locked --all-targets

  # Every configuration shipped as an example must stay parseable, so that the
  # README can reference them without drifting from the code.
  examples:
    name: validate example configs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-proxy
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-proxy

      - name: Build the binary
        run: cargo build --locked

      - name: Validate every example
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for file in config/examples/*.yaml; do
            if ! ./target/debug/spire validate -c "$file"; then
              echo "::error file=$file::configuration example does not validate"
              status=1
            fi
          done
          exit $status
